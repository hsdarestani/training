name: A+Trainer CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/sw.js
      - name: Smoke-test API
        run: |
          node server.js > /tmp/a-trainer.log 2>&1 &
          APP_PID=$!
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:3087/api/health; then
              kill $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/a-trainer.log
          kill $APP_PID || true
          exit 1

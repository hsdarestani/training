name: Deployment diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production HTTPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "--- direct app ---"
            curl -fsS http://127.0.0.1:3087/api/health
            echo
            echo "--- https app ---"
            curl -fsS https://training.smarbiz.sbs/api/health
            echo
            echo "--- listeners ---"
            ss -ltnp 2>/dev/null | grep -E ':(80|443|3087)\b' || true

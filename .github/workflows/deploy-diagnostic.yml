name: Deployment diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH, app, nginx and SSL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -e
            echo "ssh-ok"
            echo "host=$(hostname)"
            echo "user=$(whoami)"
            echo "node=$(command -v node || true)"
            echo "nginx=$(command -v nginx || true)"
            echo "pm2=$(command -v pm2 || true)"
            echo "--- listeners ---"
            ss -ltnp 2>/dev/null | grep -E ':(22|80|443|3087)\b' || true
            echo "--- app health ---"
            curl -fsS http://127.0.0.1:3087/api/health
            echo
            echo "--- nginx health ---"
            curl -fsS -H 'Host: training.smarbiz.sbs' http://127.0.0.1/api/health
            echo
            echo "--- dns ---"
            getent ahostsv4 training.smarbiz.sbs || true
            echo "--- certs ---"
            certbot certificates 2>/dev/null || true
